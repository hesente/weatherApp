      <div class="weather-container">
        <div class="weather-data">
          <div class="current-weather-top">
            <img src="images/116.png" alt="weather_icon" class="weather-icon" />
            <div>
              <h4 class="city">Воронеж</h4>
              <p class="will-it-rain">В ближайшее время осадков не ожидается</p>
            </div>
            <div class="temperature-container">
              <p class="temperature">3<span class="gradus">&deg;</span></p>
              <p class="weather">Солнечно</p>
            </div>
          </div>
          <p class="feels-like">
            <span class="feels-like-icon"></span>Ощущается как 20&deg;
          </p>
          <p class="wind">
            <span
              ><img src="images/wind-svgrepo-com.svg" class="wind-icon" /></span
            >4.3 м/с
          </p>

          <div class="future-days">
            <div class="next-day-card">
              <p class="day">07:00</p>
              <img src="images/116.png" alt="weather-next" />
              <p class="weather-next-day">14&#176;</p>
            </div>

            <div class="next-day-card">
